# 此工作流会在update_daily.yml执行成功后触发，用于将daily.html部署到GitHub Pages

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Update_daily"]
    types:
      - completed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仅当触发的工作流成功时才运行，手动触发和push时也运行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: Sync to gh-pages branch
      run: |
        # 配置Git
        git config --global user.email "791751568@qq.com"
        git config --global user.name "大清第一巴图鲁"

        # 保存main分支下的daily目录内容到临时位置
        echo "备份main分支下的daily目录..."
        mkdir -p temp_daily
        cp -r daily/* temp_daily/

        # 无论远程分支是否存在，先确保本地没有gh-pages分支
        if git show-ref --verify --quiet refs/heads/gh-pages; then
          echo "删除本地gh-pages分支..."
          git branch -D gh-pages
        fi

        # 检查是否存在远程gh-pages分支
        if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
          echo "远程gh-pages分支已存在，从远程创建并切换..."
          git checkout -b gh-pages origin/gh-pages
        else
          echo "远程gh-pages分支不存在，创建新的orphan分支..."
          git checkout --orphan gh-pages
          git rm -rf .
        fi

        # 从临时位置恢复daily目录内容
        echo "恢复daily目录内容..."
        mkdir -p daily
        cp -r temp_daily/* daily/
        rm -rf temp_daily

        # 检查daily.html文件是否存在
        if [ ! -f "daily/daily.html" ]; then
          echo "错误: 找不到daily/daily.html文件"
          exit 1
        fi

        echo "找到daily/daily.html文件"
        # 复制daily.html到根目录作为index.html
        cp daily/daily.html index.html

        # 提交更改
        git add index.html daily/
        if git diff-index --quiet HEAD; then
          echo "没有检测到更改，跳过提交..."
        else
          git commit -m "Update GitHub Pages with latest daily report"
          git push origin gh-pages --force
        fi

    - name: Show deployment URL
      run: |
        echo "部署成功！访问地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
